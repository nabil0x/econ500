# Masters Exam Study Hub — MkDocs Configuration
site_name: Economics Mastery
site_description: Free MSc Economics exam resources — Department of Economics, Jahangirnagar University. Solved past papers, exam guides, and interactive study tools for Microeconomics, Macroeconomics, Development, Political Economy & Health Economics.
site_author: Department of Economics, Jahangirnagar University
site_url: https://nabil0x.github.io/econ500/
repo_url: https://github.com/nabil0x/econ500
repo_name: econ500

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: ju
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: ju-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: DM Sans
    code: JetBrains Mono
  logo: assets/ju-logo.svg
  favicon: assets/ju-logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - header.autohide
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nabil0x/econ500
      name: GitHub
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/nabil.ann
      name: Facebook
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX  # ← Replace with real GA4 ID to enable analytics

extra_css:
  - stylesheets/extra.css
  - stylesheets/visitor-logger.css
  - stylesheets/dashboard.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/visitor-logger.js
  - javascripts/dashboard.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# Exclude non-markdown files from the build to keep it fast
# PDFs are symlinked via course directories and served as original content
exclude_docs: |
  *.jpg
  *.jpeg
  *.png
  *.gif
  *.docx
  *.pptx
  *.ppt
  *.zip
  !assets/*.png
  !assets/*.jpg
  !assets/*.svg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 2-4
  - tables
  - attr_list
  - md_in_html
  - def_list

