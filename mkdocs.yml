# Masters Exam Study Hub — MkDocs Configuration
site_name: Masters Exam Study Hub
site_description: MSc Economics exam preparation — Microeconomics, Macroeconomics, Development, Political Economy, Health Economics
site_author: Econ 501/503/507/512
repo_url: https://github.com/USERNAME/REPONAME
repo_name: Study Hub

theme:
  name: material
  palette:
    primary: indigo
    accent: teal
  font:
    text: Merriweather
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/USERNAME/REPONAME
  analytics:
    provider: google
    property: G-XXXXXXXXXX

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 2-4
  - tables
  - attr_list
  - md_in_html
  - def_list

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

